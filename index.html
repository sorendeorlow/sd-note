<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Teleport × Polyphonic · A note & a few questions</title>
<style>
  :root{
    --navy:#0A1428; --ink:#05080f; --teal:#00E5C0; --teal-dim:#84e4d3;
    --red:#ff6a5f; --text:#eef3f7; --muted:#93a3b5; --line:#1e2f47;
    --card:#0f1b2c; --card2:#0c1725;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:radial-gradient(130% 70% at 50% -8%, #12263f 0%, var(--navy) 40%, var(--ink) 100%) no-repeat fixed;
    background-color:var(--ink);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{max-width:680px;margin:0 auto;padding:26px 22px 60px;display:flex;flex-direction:column;gap:30px}
  .fade{opacity:0;transform:translateY(10px);animation:rise .7s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}}

  .eyebrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:11.5px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .eyebrow .brand{color:#a9bccf}
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);opacity:.8}
  .rule{height:3px;width:52px;border-radius:2px;background:var(--teal)}

  h1{font-size:clamp(28px,7.6vw,40px);line-height:1.12;letter-spacing:-.018em;font-weight:800;margin:0;
    text-wrap:balance}
  h1 .accent{color:var(--teal)}
  .note{font-size:clamp(16.5px,4.4vw,19px);color:#cdd9e5;margin:0;max-width:38ch}
  .note b{color:#fff}

  .block{border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px;background:var(--card)}
  .block.plat{border-color:rgba(255,106,95,.34);background:linear-gradient(180deg,rgba(255,106,95,.06),rgba(255,106,95,.02))}
  .block.tele{border-color:rgba(0,229,192,.34);background:linear-gradient(180deg,rgba(0,229,192,.06),rgba(0,229,192,.02))}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    padding:5px 12px;border-radius:999px;margin-bottom:14px}
  .plat .tag{color:#2a0e0b;background:var(--red)}
  .tele .tag{color:#04231e;background:var(--teal)}
  .qs{display:flex;flex-direction:column;gap:14px}
  .q{position:relative;padding-left:20px;font-size:clamp(16.5px,4.4vw,18.5px);color:#dbe5ef;font-weight:500}
  .q::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:2px;border-radius:2px}
  .plat .q::before{background:var(--red)}
  .tele .q::before{background:var(--teal)}
  .q b{color:#fff;font-weight:700}

  .pilot{border-radius:16px;padding:20px;background:linear-gradient(180deg,rgba(0,229,192,.12),rgba(0,229,192,.04));
    border:1px solid rgba(0,229,192,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .pilot .lab{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:8px}
  .pilot p{margin:0;font-size:clamp(16.5px,4.4vw,19px);color:#eaf4f0;font-weight:500}
  .pilot b{color:#fff;font-weight:700}

  .thread{font-size:15px;color:var(--muted);line-height:1.6;padding-left:16px;border-left:2px solid var(--line)}
  .thread b{color:#c7d3df;font-weight:600}

  .sec-h{font-size:clamp(20px,5.4vw,25px);font-weight:800;letter-spacing:-.01em;line-height:1.18;margin:0 0 2px;text-wrap:balance}
  .sec-h .accent{color:var(--teal)}
  .sec-sub{font-size:14px;color:var(--muted);margin:0 0 4px}

  .stack{display:flex;flex-direction:column;gap:12px}
  .person{border:1px solid var(--line);border-radius:14px;padding:15px 16px 16px;background:var(--card2);
    border-left:3px solid rgba(0,229,192,.55)}
  .person .nm{font-size:16.5px;font-weight:800;color:#fff;letter-spacing:-.01em}
  .person .role{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-dim);margin:3px 0 9px}
  .person .qz{font-size:16px;color:#d7e2ec;line-height:1.5}
  .person .qz b{color:#fff;font-weight:700}

  .starts{display:flex;flex-direction:column;gap:12px}
  .opt{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:var(--card2)}
  .opt.lead{border-color:rgba(0,229,192,.4);background:linear-gradient(180deg,rgba(0,229,192,.06),rgba(0,229,192,.02))}
  .opt .oh{font-size:16px;font-weight:800;color:#fff;margin-bottom:4px}
  .opt .oh span{color:var(--teal)}
  .opt .od{font-size:14.5px;color:#c2cede;line-height:1.5}
  .opt .od b{color:#fff;font-weight:700}

  .ask{border-radius:16px;padding:22px;background:linear-gradient(180deg,rgba(0,229,192,.1),rgba(0,229,192,.03));
    border:1px solid rgba(0,229,192,.42)}
  .ask .lab{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:9px}
  .ask p{margin:0;font-size:clamp(18px,4.8vw,21px);font-weight:700;color:#fff;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
  .ask .sign{display:flex;align-items:center;gap:12px;margin-top:16px}
  .ask .sign .avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:0 0 48px;border:1px solid rgba(0,229,192,.4)}
  .ask .sign .nm{font-size:15px;font-weight:800;color:#fff;line-height:1.2}
  .ask .sign .rl{font-size:13px;color:var(--muted);font-weight:500;margin-top:1px}
  .ask .site{display:inline-block;margin-top:15px;font-size:15.5px;font-weight:800;color:var(--teal);
    text-decoration:none;border-bottom:1px solid rgba(0,229,192,.5);padding-bottom:3px}
  .ask .site:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:3px}

  footer{border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:#4d6076;letter-spacing:.02em}

  .lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:26px}
  .lockcard{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
  .lockcard .eyebrow{display:flex;gap:10px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .lockcard .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--teal)}
  .lockcard h1{font-size:23px;line-height:1.2;letter-spacing:-.01em;margin:2px 0 2px}
  .lockcard p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.5}
  .lockform{display:flex;gap:9px;margin-top:6px}
  .lockform input{flex:1;min-width:0;background:#0c1725;border:1px solid var(--line);border-radius:11px;
    color:var(--text);font-size:16px;padding:13px 14px;outline:none;-webkit-appearance:none}
  .lockform input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,229,192,.16)}
  .lockform button{flex:0 0 auto;background:var(--teal);color:#04231e;border:0;border-radius:11px;
    font-size:15px;font-weight:800;padding:0 18px;cursor:pointer}
  .lockform button:active{transform:translateY(1px)}
  .err{font-size:13.5px;color:#ff8a80;min-height:1.1em;margin-top:-2px}
  .shake{animation:shk .34s}
  @keyframes shk{10%,90%{transform:translateX(-1px)}30%,70%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div class="lock" id="lock">
  <div class="lockcard">
    <div class="eyebrow"><span style="color:#a9bccf">Teleport × Polyphonic</span><span class="dot"></span><span>Private</span></div>
    <h1>This note is private.</h1>
    <p>Enter the passcode to read it.</p>
    <form class="lockform" id="f" autocomplete="off">
      <input id="pw" type="password" inputmode="text" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" placeholder="Passcode" aria-label="Passcode">
      <button type="submit">View</button>
    </form>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>
<div id="content" hidden></div>

  async function unlock(pw){
    const kb = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:dec(ENC.s), iterations:ENC.n, hash:'SHA-256' },
      kb, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:dec(ENC.i) }, key, dec(ENC.c));
    return new TextDecoder().decode(pt);
  }

        err = document.getElementById('err'), lock = document.getElementById('lock'),
        content = document.getElementById('content');
  f.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    try {
      const html = await unlock(pw.value);
      content.innerHTML = html; content.hidden = false; lock.remove();
      window.scrollTo(0,0);
    } catch (_) {
      err.textContent = 'That passcode didn’t work. Try again.';
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      pw.select();
    }
  });
  pw.focus();
